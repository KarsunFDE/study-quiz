<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Karsun FDE — Study Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<header class="border-b border-slate-200 bg-white">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <div>
        <h1 class="text-lg font-semibold">Karsun FDE — Study Quiz</h1>
        <p class="text-xs text-slate-500">Cohort #1 · 25 May – 2 Jul 2026</p>
      </div>
      <nav id="topnav" class="hidden text-sm gap-4 ml-2 self-end pb-1">
        <a href="index.html" class="text-slate-900 font-medium border-b-2 border-emerald-500 pb-3 -mb-3">Take a quiz</a>
        <a href="history.html" class="text-slate-500 hover:text-slate-900">My study</a>
      </nav>
    </div>
    <div id="who" class="text-sm"></div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8">

  <!-- name picker -->
  <section id="name-picker" class="hidden">
    <h2 class="text-2xl font-semibold mb-2">Who are you?</h2>
    <p class="text-slate-600 mb-6">Progress saves in this browser. Pick the same name each time on this device.</p>
    <div id="name-buttons" class="flex flex-wrap gap-2 mb-4"></div>
    <details class="mt-4">
      <summary class="text-sm text-slate-500 cursor-pointer">Other name…</summary>
      <form id="other-name-form" class="mt-2 flex gap-2">
        <input type="text" id="other-name" placeholder="Your first name" class="border border-slate-300 rounded px-3 py-1.5 text-sm" />
        <button type="submit" class="bg-slate-900 text-white rounded px-3 py-1.5 text-sm">Save</button>
      </form>
    </details>
  </section>

  <!-- dashboard -->
  <section id="dashboard" class="hidden">

    <div class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-4" id="stats">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Quizzes taken</div>
        <div class="text-2xl font-semibold mt-1" id="stat-count">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Overall accuracy</div>
        <div class="text-2xl font-semibold mt-1" id="stat-accuracy">—</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Weakest topic</div>
        <div class="text-lg font-medium mt-1" id="stat-weak">—</div>
      </div>
    </div>

    <h2 class="text-xl font-semibold mb-3">Pick a quiz</h2>
    <div id="weeks" class="space-y-4"></div>

    <div class="mt-10 pt-6 border-t border-slate-200 flex justify-between items-center text-sm text-slate-500">
      <span>Signed in as <strong id="who-foot"></strong></span>
      <button id="reset-btn" class="text-rose-700 hover:underline">Reset all my progress</button>
    </div>
  </section>

</main>

<script type="module" src="js/progress.js"></script>
<script type="module" src="js/bank-loader.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/home.js"></script>
</body>
</html>
